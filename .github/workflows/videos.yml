name: Automotive Stock Video Preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Send one selected video to Telegram"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-moto-autoposter
  cancel-in-progress: false

jobs:
  publish-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Preview or publish one video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOPOSTER_DRY_RUN: ${{ inputs.publish && 'false' || 'true' }}
        run: python video_main.py
      - name: Commit publication history
        if: ${{ success() && inputs.publish }}
        shell: bash
        run: |
          if git diff --quiet -- storage/published.json; then
            echo "Publication history did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/published.json
          git commit -m "Update publication history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
